[package]
name = "diffy"
version = "0.1.0"
edition = "2024"
description = "A live, Tree-sitter highlighted Git diff viewer for the terminal"

[dependencies]
anyhow = "1"
crossterm = "0.28"
notify = "8"
ratatui = "0.29"
similar = "2.7"
tree-sitter-highlight = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-go = "0.25"
tree-sitter-html = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
